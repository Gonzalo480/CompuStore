
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar producto - CompuStore</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="pagina-agregar-producto">

    <!-- Encabezado -->
    <header class="encabezado-productos">
        <h1>CompuStore</h1>
        <p>Tu tienda de artículos de computación</p>
    </header>

    <!-- Contenido principal -->
    <main class="contenido-agregar">

        <section class="formulario-producto">

            <h2>Agregar producto</h2>

            <p class="texto-formulario">
                Completá los datos para registrar un nuevo producto.
            </p>

            <form id="formProducto">

                <div class="campo-producto">
                    <label for="nombre">Nombre del producto</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej.: Teclado mecánico"
                        required>
                </div>

                <div class="campo-producto">
                    <label for="categoria">Categoría</label>
                    <input
                        type="text"
                        id="categoria"
                        placeholder="Ej.: Periféricos"
                        required>
                </div>

                <div class="campo-producto">
                    <label for="precio">Precio</label>
                    <input
                        type="number"
                        id="precio"
                        min="0"
                        step="0.01"
                        placeholder="Ej.: 25000"
                        required>
                </div>

                <div class="campo-producto">
                    <label for="stock">Stock disponible</label>
                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        placeholder="Ej.: 10"
                        required>
                </div>

                <button type="submit" class="btn-guardar-producto">
                    Agregar producto
                </button>

            </form>

            <p id="mensajeProducto"></p>

            <button
                type="button"
                class="btn-volver-perfil"
                onclick="window.location.href='/perfil_pagina'">
                Volver al perfil
            </button>

        </section>

    </main>

    <!-- JavaScript existente -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
        // Obtener el token guardado
        const token = localStorage.getItem("token");

        // Comprobar si existe el token
        if (!token) {
            alert("Necesitas iniciar sesión.");
            window.location.href = "/";
        }
    </script>

</body>
</html>
