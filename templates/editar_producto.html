<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto - CompuStore</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="pagina-editar-producto">

    <!-- Encabezado -->
    <header class="encabezado-editar-producto">
        <h1>CompuStore</h1>
        <p>Tu tienda de artículos de computación</p>
    </header>

    <!-- Contenido principal -->
    <main class="contenido-editar-producto">

        <section class="formulario-editar-producto">

            <h2>Editar producto</h2>

            <p class="texto-editar-producto">
                Modificá los datos del artículo seleccionado.
            </p>

            <form id="formEditarProducto" data-id="{{ producto[0] }}">

                <div class="campo-editar-producto">
                    <label for="nombreEditar">Nombre del producto</label>
                    <input
                        type="text"
                        id="nombreEditar"
                        value="{{ producto[1] }}"
                        placeholder="Ej.: Teclado mecánico"
                        required
                    >
                </div>

                <div class="campo-editar-producto">
                    <label for="categoriaEditar">Categoría</label>
                    <input
                        type="text"
                        id="categoriaEditar"
                        value="{{ producto[2] }}"
                        placeholder="Ej.: Periféricos"
                        required
                    >
                </div>

                <div class="campo-editar-producto">
                    <label for="precioEditar">Precio</label>
                    <input
                        type="number"
                        id="precioEditar"
                        value="{{ producto[3] }}"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo-editar-producto">
                    <label for="stockEditar">Stock disponible</label>
                    <input
                        type="number"
                        id="stockEditar"
                        value="{{ producto[4] }}"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <button type="submit" class="btn-guardar-cambios">
                    Guardar cambios
                </button>

            </form>

            <p id="mensajeEditar"></p>

            <button
                type="button"
                class="btn-volver-productos"
                onclick="window.location.href='/productos_lista'">
                Volver a productos
            </button>

        </section>

    </main>

    <!-- JavaScript existente -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
        // Comprobar si existe el token
        const token = localStorage.getItem("token");

        if (!token) {
            alert("Necesitas iniciar sesión.");
            window.location.href = "/";
        }
    </script>

</body>
</html>
